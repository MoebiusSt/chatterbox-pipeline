job:
  name: default
  run_label:   # empty by default, use it to organise the tasks/files/folders

input:
  text_file: input-document.txt     # txt-file in data/input/texts folder. Also accepts relative paths below the data/input/texts folder.

preprocessing:
  enabled: true
  normalize_line_endings: true    # Convert \r\n and \r to \n
  normalize_punct: true           # Normalize punctuation (incl. quotes & Chatterbox standards)

chunking:
  target_chunk_limit: 380
  max_chunk_limit: 460
  min_chunk_length: 80
  spacy_model: en_core_web_sm # use de_core_news_sm for german jobs (spaCy has no de_core_web_*)
  force_paragraph_chunks: true  # true (Chatterbox default): every \n\n is a HARD chunk boundary → paragraph-break silence guaranteed.
                                # false (VibeVoice): only \n\n\n+ (2+ empty lines) is a HARD boundary (→ long-pause silence);
                                #   single \n\n is a preferred but soft split-point (greedy packing still applies).
  strict_speaker_validation: true  # true: abort preprocessing with a verbose error message if the source text contains
                                   #   <speaker:id> markup whose id is not defined in generation.speakers (default-speaker
                                   #   aliases "0", "default", "reset" are always accepted).
                                   # false: legacy behaviour – log a warning and silently fall back to the default speaker.
  collapse_redundant_speaker_tags: true  # true: consecutive <speaker:id> tags that resolve to the already active
                                         #   speaker are treated as no-ops (no extra hard chunk break, no artificial pause).
                                         # false: legacy behaviour – every <speaker:id> tag forces a hard boundary.

generation:
  num_candidates: 2
  max_retries: 1
  model_type: standard  # Options: "standard", "multilingual", "turbo", "qwen3", and VibeVoice Hub: "vibevoice" (7B Q8), "vibevoice_1_5b" (1.5B), "vibevoice_q4" (7B Q4 low-VRAM) — same tts_params for all three
                        # qwen3 expert: add  qwen3_attn_impl: flash_attention_2  here to override the default sdpa attention (fa not recommended – measured slower for TTS batch-1 workloads)
  default_speaker: stephan_moebius_2
  global_seed: 12345  # Base Seed + Candidate-Offset + Text-Hash keeps Tasks reproducible but Chunks discerned
  seed_fixed: false    # true = single integer for all torch.manual_seed calls (see docs/SEEDING.md); requires global_seed > 0 or speaker seed > 0

  # Speaker definitions - Define all your speakers here and reference them by id in any other job. The default speaker should have all possible key/value pairs defined!

  speakers:
    - id: stephan_moebius_2                     # use any string you like
      reference_audio: stephan_moebius_2.wav   # file in data/input/reference_audio folder
      language: en
      tts_params:
        # Base TTS parameters - these define the STARTING POINTS for candidate ramping.
        # Parameters not supported by the active model_type are gracefully skipped at runtime.
        #
        # Chatterbox models (standard / multilingual / turbo):
        # Ramping (all expressive): param = base + (dev * ramp_pos), ramp_pos 0..1. Positive dev = ramp UP, negative = DOWN.
        # - exaggeration: start value; use negative *exaggeration_max_deviation* to ramp DOWN (e.g. -0.1)
        # - cfg_weight:   start; positive *cfg_weight_max_deviation* ramps UP
        # - temperature:  start; positive *temperature_max_deviation* ramps UP
        # - min_p, top_p, repetition_penalty: passed as-is
        # - turbo only: top_k (default 1000), norm_loudness (bool, enables built-in loudness normalization)
        #
        # Qwen3 model (qwen3):
        # Same formula: param = base + (dev * ramp_pos) for all ramped fields.
        # - temperature              default 0.9  | start; RAMP-UP with positive *temperature_max_deviation*
        #                                            <1 more confident/deterministic, >1 more random/creative
        # - top_k                    default 50   | start; RAMP-UP with positive *top_k_max_deviation*
        # - top_p                    default 1.0  | lower = more focused, reduce diversity (not ramped)
        # - repetition_penalty       default 1.05 | raise to 1.1–1.15 to suppress repetitions (not ramped)
        # - max_new_tokens           default 2048 | hard cap on output length (stops at limit or EOS)
        # - do_sample                default true | false = greedy decoding (deterministic, less natural)
        # - subtalker_top_k          | start; RAMP-UP with positive *subtalker_top_k_max_deviation*
        # - subtalker_temperature   | start; positive dev = RAMP-UP, negative = RAMP-DOWN
        # - subtalker_top_p / subtalker_dosample  | not ramped
        # - exaggeration / cfg_weight / min_p are not supported and will be silently skipped
        #
        # VibeVoice models (vibevoice / vibevoice_1_5b / vibevoice_q4):
        # - cfg_scale                default 1.30 | MIN on first expressive candidate; RAMP-UP with cfg_scale_max_deviation (later = higher = calmer; lower values are more lively, <1.2 risky)
        # - cfg_scale_max_deviation               | add over expressive candidates (same ramp_pos as temperature/diffusion_steps)
        # - temperature              default 0.95 | MIN on first expressive; RAMP-UP with temperature_max_deviation; higher values increase prosody liveliness (ignored if use_sampling=false)
        # - top_p                    default 0.95 | only used when use_sampling=true; otherwise ignored
        # - diffusion_steps          default 20   | MIN on first expressive; RAMP-UP with diffusion_steps_max_deviation (clamp 5–60; 0 = no step ramp). Higher = more noise/detail/risk
        # - diffusion_steps_max_deviation         | add over expressive candidates (default 0); pairs with cfg_scale/temperature ramp for prosody balance
        # - voice_speed_factor       default 1.0  | try adjusts reference voice speed in very small increments (0.98, 1.05)
        # - use_sampling             default false| false=deterministic, true=sampling with temperature/top_p

        exaggeration: 0.45                  # start (candidate 1)
        exaggeration_max_deviation: -0.1    # negative dev → ramp DOWN

        cfg_weight: 0.15                    # start
        cfg_weight_max_deviation: 0.20      # positive dev → ramp UP

        temperature: 0.9                    # start
        temperature_max_deviation: 0.20     # positive dev → ramp UP

        repetition_penalty: 1.5             # Penalty for repeated output tokens (default is 1.2, was 2.0 earlier) 
        
        # Additional sampling parameters for fine-tuning generation
        min_p: 0.06                         # Minimum probability threshold for token sampling (Chatterbox only)
        top_p: 0.94                         # Top-p (nucleus) sampling threshold
        
      # Conservative candidate params for most likely success. Also fallback for retries when the generation fails.
      conservative_candidate:
        enabled: true    # if true the last of num_candidates will use conservative candidate params.
        exaggeration: 0.4
        cfg_weight: 0.35
        temperature: 0.8
        min_p: 0.08    # Higher for more stability
        top_p: 0.9     # Lower for less variance

    - id: stephan_moebius_3
      reference_audio: stephan_moebius_3.wav
      language: en
      tts_params:
        exaggeration: 0.5
        exaggeration_max_deviation: -0.2
        cfg_weight: 0.15
        cfg_weight_max_deviation: 0.30
        temperature: 0.88
        temperature_max_deviation: 0.15
        repetition_penalty: 1.6
        min_p: 0.07
        top_p: 0.93
      conservative_candidate:
        enabled: false
        exaggeration: 0.4
        cfg_weight: 0.4
        temperature: 0.8

    - id: stephan_moebius_4
      reference_audio: stephan_moebius_4.wav
      language: en
      tts_params:
        exaggeration: 0.55
        exaggeration_max_deviation: -0.2
        cfg_weight: 0.15
        cfg_weight_max_deviation: 0.25
        temperature: 0.9
        temperature_max_deviation: 0.3
        repetition_penalty: 1.3
        min_p: 0.05
        top_p: 0.95
      conservative_candidate:
        enabled: false
        exaggeration: 0.4
        cfg_weight: 0.4
        temperature: 0.75
        
    - id: test1
      reference_audio: stephan_moebius_4.wav
      language: en
      tts_params:
        exaggeration: 0.5
        exaggeration_max_deviation: 0.0
        cfg_weight: 0.5
        cfg_weight_max_deviation: 0.0
        temperature: 0.8  #only ramp up temperature, evaluate candidates with different temperature
        temperature_max_deviation: 0.60
        repetition_penalty: 1.5
        min_p: 0.05  # within normal min_p and top_p range
        top_p: 0.99
      conservative_candidate:
        enabled: false
    - id: test2
      reference_audio: stephan_moebius_4.wav
      language: en
      tts_params:
        exaggeration: 0.80  #only ramp down exaggeration, evaluate effect of exaggeration
        exaggeration_max_deviation: -0.5
        cfg_weight: 0.50
        cfg_weight_max_deviation: 0.0
        temperature: 1.05
        temperature_max_deviation: 0.0
        repetition_penalty: 1.4
        min_p: 0.07 # lower likelihood of artefacts with slightly narrower min_p and top_p range
        top_p: 0.96
    - id: test3
      reference_audio: stephan_moebius_4.wav
      language: en
      tts_params:
        exaggeration: 0.40
        exaggeration_max_deviation: 0.0
        cfg_weight: 0.20 #only ramp up cfg_weight, evaluate effect of cfg_weight
        cfg_weight_max_deviation: 0.6
        temperature: 1.05
        temperature_max_deviation: 0.0
        repetition_penalty: 1.4
        min_p: 0.05
        top_p: 0.99

validation:
  whisper_model: medium # base small medium large
  similarity_threshold: 0.70  # WhisperValidator: token-based similarity of original and transcribed text tokens
  similarity_threshold_bonus_max: 0.08  # Upper cap for the length/punctuation based threshold reduction
  min_quality_score: 0.72  #  WhisperValidator: 70% * similarity_score + 30% * length_score
  numbers_normalization_mode: placeholder  # off|placeholder|digits|words (applied only for language != 'en')
  whisper_initial_prompt_enabled: true    # If true, pass an initial prompt to Whisper
  whisper_initial_prompt_text: ""  # Style-only prompt, no language directive

  # ASR backend selection for validation/tail-trim/prosody alignment.
  # auto → whisper for ALL model types (including VibeVoice-TTS).
  # VibeVoice-ASR is available as explicit opt-in (``vibevoice_asr``) but no
  # longer auto-selected: its ~16 GB weight footprint pushes consumer GPUs
  # (≤16 GB) into CPU-RAM spillover after TTS, and the vendored long-form
  # inference path currently hits an off-by-one mask bug on ≥4-min clips.
  # See docs/TESTRUN_FINDINGS.md for benchmark data.
  asr_backend: auto   # auto | whisper | vibevoice_asr
  vibevoice_asr:
    model_id: microsoft/VibeVoice-ASR
    language_model: Qwen/Qwen2.5-7B
    device: auto                # auto | cuda | cpu | mps
    attn_implementation: auto   # auto | flash_attention_2 | sdpa | eager
    max_new_tokens: 32768
    temperature: 0.0
    top_p: 1.0
    num_beams: 1
    target_sample_rate: 24000
    hotwords: []                # optional per-job

  # Preprocessing before validation: Tail-end speech-aware trim
  preprocessing:
    tail_trim:
      enabled: true
      lookback_seconds: 2.0
      post_speech_silence_ms: 200
      fade_out_ms: 100
      prefer_whisperx: true
      whisperx_device: cuda
      debug_save_removed_tail: true
      persist_trimmed_candidate: true
      smart_match:
        enabled: true
        last_n_words: 3
        fuzzy_ratio: 0.9
        search_window_words: 30
        max_trailing_asr_words: 10
        vad_reject_gap_seconds: 2.5
        vad_reject_min_trailing_asr_words: 3
        min_cut_vs_expected_ratio: 0.40
        vad_short_cut_expected_ratio: 0.75
        vad_short_cut_gap_seconds: 1.0
        language_gate: [en, de, fr, es, it]
      vad:
        aggressiveness: 1        # 0..3
        frame_ms: 20
        min_voiced_ms: 70
        hangover_ms: 150

  # Prosody/MOS/Alignment configuration for automatic selection
  prosody:
    enabled: true
    weights:
      semantic_alignment: 0.08  
      flow: 0.23                # Derived from wpm_min and wpm_max
      liveliness: 0.29
      intelligibility: 0.08     
      mos: 0.32                 # MOS-Weight, note: MOS will score double as per gamma_mos
    targets:                    # the deviation from the mediean defines the flow score
      wpm_min: 110              # halfwidth (165-110)/2= 20 -> target wpm 138  
      wpm_max: 165
      liveliness_target: 0.50
      liveliness_halfwidth: 0.20        # half-width of the triangular liveliness window (smaller -> more discriminative)
      f0_std_low_hz: 15.0               # f0 std (Hz) mapped to 0.0 (monotone speech)
      f0_std_high_hz: 40.0              # f0 std (Hz) mapped to 1.0 (lively prosody)
      # f0_std_low_hz – anything below this is classified as “too flat/monotonous” and is given the lowest score (0) for this section. Set it higher = you’re telling the pipeline: “Only when there’s this much pitch variation do I even call it a speech melody; anything less is just a muddle to me.”
      # f0_std_high_hz – anything above this is considered ‘fully utilised / maximum movement’ (1). Set it higher = you need more fluctuation before the score is ‘full’. Set it lower = even moderate movement counts as ‘at the top’.
    select:
      alpha_quality: 0.55       # Whisper Quality-Weight
      beta_prosody: 0.30        # Prosody-Weight
      gamma_mos: 0.15           # additional MOS-direct weight
    thresholds:
      min_prosody_score: 0.40   # Prosody-Gate

  mos:
    provider: utmos         # combined|nisqa|utmos
    prefer_utmosv2: true      # if true: native utmosv2 (pip install from GitHub, see requirements.txt); else UTMOS v1 via VERSA
    use_gpu: true              # NISQA + UTMOS/UTMOSv2: use CUDA when available (e.g. RTX 4080); set false for CPU-only
    utmosv2_num_repetitions: 1  # UTMOSv2 only: 1 = fast, matches utmosv2 default; 3–5 = smoother scores, more compute
    # MOS models are trained on short utterances. For long VibeVoice chunks we
    # window the audio and aggregate window-level MOS to stay in-distribution.
    enabled_languages: [de, en] # Language-Gate: MOS only für de/en
    min_mos: 1.5               # MOS-Threshold (1..5); ~>3.5 is good. Also acts as scale floor for mos_unit. Make 2.4 for NISQA and 1.5 for UTMOS
    scale: raw_1_5             # mos_score = clip((mos-min_mos)/(5-min_mos),0,1)
    nisqa_weights_path: "NISQA/weights/nisqa_tts.tar"  # NISQA-TTS v1 Naturalness
    segmentation:
      max_unsegmented_seconds: 20.0  # score() is used for audio shorter than this
      window_s: 12.0                 # sliding window length
      hop_s: 10.0                    # hop between windows
      aggregator: median             # median | mean | min
      diagnostic_percentile: 10      # low-percentile MOS diagnostic for local failures
      export_window_scores: false    # true stores per-window MOS scores in prosody details

  # alignment: (removed; alignment language gating handled via preprocessing.tail_trim.smart_match.language_gate)

  selection:
    gating:
      require_mos: false        # false = MOS threshold is diagnostic only; true = reject raw_mos < min_mos
      require_similarity: true  # ASR/Whisper threshold participates in final is_valid
      duration:
        enabled: true           # rejects token-cap loops that stay lexically similar
        min_word_count: 12      # avoid over-gating tiny fragments
        max_duration_ratio: 1.5 # fail if audio is >2x the target-WPM duration
        max_audio_duration_s: 0 # 0 disables absolute duration cap
        min_wpm: 0              # 0 disables absolute WPM floor

audio:
  silence_duration:
    normal: 0.40  # inserted between chunks if split was between sentences
    paragraph: 0.90  # inserted if split was before paragraph break blank line
    long: 1.30  # inserted for explicit long paragraph breaks (>= 2 empty lines)
  sample_rate: 24000
  # ChatterboxTTS and Qwen3tts native sample rate - NOT a user setting!
  # This must match the actual output sample rate of ChatterboxTTS and Qwen3tts (24kHz)
  # Only change this if ChatterboxTTS and Qwen3tts itself changes its output sample rate

  # Optional trimming of leading/trailing silence on segment boundaries during assembly
  silence_trim:
    enabled: true   # if true, trim low-amplitude leading/trailing samples at boundaries
    threshold: 0.06  # absolute amplitude threshold used for trimming
    fade_duration: 0.3  # fade duration (seconds) applied at start/end after trimming


  
  # Audio normalization settings
  normalization:
    enabled: true            # Enable/disable audio normalization
    target_level: -1.3      # Target loudness level in dB (unit depends on method)
    method: "peak"            # Normalization method: "lufs", "rms", or "peak"
    saturation_factor: 0.01   # TanH saturation compression: 0.0=none, 1.0=strong (with loudness compensation)