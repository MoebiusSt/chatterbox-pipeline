job:
  name: default
  run-label:   # empty by default, use it to organise the tasks/files/folders

input:
  text_file: input-document.txt     # txt-file in data/input/texts folder. Also accepts relative paths below the data/input/texts folder.

preprocessing:
  enabled: true
  normalize_line_endings: true    # Convert \r\n and \r to \n
  normalize_punct: true           # Normalize punctuation (incl. quotes & Chatterbox standards)

chunking:
  target_chunk_limit: 380
  max_chunk_limit: 460
  min_chunk_length: 80
  spacy_model: en_core_web_sm
  force_paragraph_chunks: true  # double newlines force chunking; ensures added paragraph break silence

generation:
  num_candidates: 2
  max_retries: 1
  model_type: standard  # Options: "standard" (ChatterboxTTS) or "multilingual" (ChatterboxMultilingualTTS)
  default_speaker: stephan_moebius_1
  global_seed: 12345  # Global seed for all TTS generations. 0 = random seed per generation
  
  # Speaker definitions - Define all your speakers here and reference them by id in any other job. The default speaker should have all possible key/value pairs defined!

  speakers:
    - id: stephan_moebius_1                     # use any string you like
      reference_audio: stephan_moebius_1.wav   # file in data/input/reference_audio folder
      language: en
      tts_params:
        # Base TTS parameters - these define the STARTING POINTS for candidate ramping:
        # - exaggeration: MAX value (will ramp DOWN from MAX to exaggeration-exag_max_deviation)
        # - cfg_weight: MIN value (will ramp UP from MIN to cfg_weight+max_dev)  
        # - temperature: MIN value (will ramp UP from MIN to temp+max_dev)
        exaggeration: 0.45                  # give MAX here
        exaggeration_max_deviation: 0.10    # ramp DOWN 

        cfg_weight: 0.15                    # give MIN here
        cfg_weight_max_deviation: 0.20      # ramp UP 

        temperature: 0.9                    # give MIN here
        temperature_max_deviation: 0.20     # ramp UP 

        repetition_penalty: 1.5             # Penalty for repeated output tokens (default is 1.2, was 2.0 earlier) 
        
        # Additional sampling parameters for fine-tuning generation
        min_p: 0.06                         # Minimum probability threshold for token sampling
        top_p: 0.94                         # Top-p (nucleus) sampling threshold
        
      # Conservative candidate params for most likely success. Also fallback for retries when the generation fails.
      conservative_candidate:
        enabled: true    # if true the last of num_candidates will use conservative candidate params.
        exaggeration: 0.4
        cfg_weight: 0.35
        temperature: 0.8
        min_p: 0.08    # Higher for more stability
        top_p: 0.9     # Lower for less variance

    - id: stephan_moebius_2
      reference_audio: stephan_moebius_2.wav
      language: en
      tts_params:
        exaggeration: 0.45
        exaggeration_max_deviation: 0.20
        cfg_weight: 0.25
        cfg_weight_max_deviation: 0.15
        temperature: 0.95
        temperature_max_deviation: 0.25
        repetition_penalty: 1.3
        min_p: 0.05
        top_p: 0.95
      conservative_candidate:
        enabled: false  # if false the ramping params will be spread over ALL num_candidates, if true the last candidate will use the conservative params.
        exaggeration: 0.4
        cfg_weight: 0.35
        temperature: 0.8

    - id: stephan_moebius_3
      reference_audio: stephan_moebius_3.wav
      language: en
      tts_params:
        exaggeration: 0.5
        exaggeration_max_deviation: 0.20
        cfg_weight: 0.15
        cfg_weight_max_deviation: 0.30
        temperature: 0.88
        temperature_max_deviation: 0.15
        repetition_penalty: 1.6
        min_p: 0.07
        top_p: 0.93
      conservative_candidate:
        enabled: false
        exaggeration: 0.4
        cfg_weight: 0.4
        temperature: 0.8

    - id: stephan_moebius_4
      reference_audio: stephan_moebius_4.wav
      language: en
      tts_params:
        exaggeration: 0.55
        exaggeration_max_deviation: 0.20
        cfg_weight: 0.15
        cfg_weight_max_deviation: 0.25
        temperature: 0.9
        temperature_max_deviation: 0.3
        repetition_penalty: 1.3
        min_p: 0.05
        top_p: 0.95
      conservative_candidate:
        enabled: false
        exaggeration: 0.4
        cfg_weight: 0.4
        temperature: 0.75

    - id: stephan_moebius_5
      reference_audio: stephan_moebius_5.wav
      language: en
      tts_params:
        exaggeration: 0.5
        exaggeration_max_deviation: 0.15
        cfg_weight: 0.25
        cfg_weight_max_deviation: 0.20
        temperature: 1.0
        temperature_max_deviation: 0.3
        repetition_penalty: 1.2
        min_p: 0.05
        top_p: 0.95
      conservative_candidate:
        enabled: false
        exaggeration: 0.4
        cfg_weight: 0.5
        temperature: 0.8
        
    - id: test1
      reference_audio: stephan_moebius_6.wav
      language: en
      tts_params:
        exaggeration: 0.5
        exaggeration_max_deviation: 0.0
        cfg_weight: 0.5
        cfg_weight_max_deviation: 0.0
        temperature: 0.8  #only ramp up temperature, evaluate candidates with different temperature
        temperature_max_deviation: 0.60
        repetition_penalty: 1.5
        min_p: 0.05  # within normal min_p and top_p range
        top_p: 0.99
      conservative_candidate:
        enabled: false
    - id: test2
      reference_audio: stephan_moebius_6.wav
      language: en
      tts_params:
        exaggeration: 0.80  #only ramp down exaggeration, evaluate effect of exaggeration
        exaggeration_max_deviation: 0.5
        cfg_weight: 0.50
        cfg_weight_max_deviation: 0.0
        temperature: 1.05
        temperature_max_deviation: 0.0
        repetition_penalty: 1.4
        min_p: 0.07 # lower likelihood of artefacts with slightly narrower min_p and top_p range
        top_p: 0.96
    - id: test3
      reference_audio: stephan_moebius_6.wav
      language: en
      tts_params:
        exaggeration: 0.40
        exaggeration_max_deviation: 0.0
        cfg_weight: 0.20 #only ramp up cfg_weight, evaluate effect of cfg_weight
        cfg_weight_max_deviation: 0.6
        temperature: 1.05
        temperature_max_deviation: 0.0
        repetition_penalty: 1.4
        min_p: 0.05
        top_p: 0.99

validation:
  whisper_model: small # base small medium large
  similarity_threshold: 0.64  # WhisperValidator: token-based similarity of original and transcribed text tokens
  min_quality_score: 0.72  #  WhisperValidator: 70% * similarity_score + 30% * length_score
  numbers_normalization_mode: placeholder  # off|placeholder|digits|words (applied only for language != 'en')
  whisper_initial_prompt_enabled: true    # If true, pass an initial prompt to Whisper
  whisper_initial_prompt_text: "Schreibe Zahlen ausgeschrieben."  # Style-only prompt, no language directive

audio:
  silence_duration:
    normal: 0.20  # inserted between chunks if split was between sentences
    paragraph: 0.80  # inserted if split was before paragraph break blank line
    long: 1.50  # inserted for explicit long paragraph breaks (>= 2 empty lines)
  sample_rate: 24000

  # Optional trimming of leading/trailing silence on segment boundaries during assembly
  silence_trim:
    enabled: true   # if true, trim low-amplitude leading/trailing samples at boundaries
    threshold: 0.01  # absolute amplitude threshold used for trimming
    min_silence_duration: 0.08  # minimum silence duration (seconds) to preserve at start/end

  # ChatterboxTTS native sample rate - NOT a user setting!
  # This must match the actual output sample rate of ChatterboxTTS (24kHz)
  # Only change this if ChatterboxTTS itself changes its output sample rate
  
  # Audio normalization settings
  normalization:
    enabled: true            # Enable/disable audio normalization
    target_level: -1.5      # Target loudness level in dB (unit depends on method)
    method: "peak"            # Normalization method: "lufs", "rms", or "peak"
    saturation_factor: 0.05   # TanH saturation compression: 0.0=none, 1.0=strong (with loudness compensation)