# Model-specific default config for Chatterbox standard/multilingual models.
# Inherits everything from default_config.yaml and overrides model-specific values.
# Job configs that use Chatterbox (standard or multilingual) can reference this file:
#
#   parent: defaults/chatterbox.yaml
#
# They then only need to specify job-specific overrides (text file, speakers, etc.).

