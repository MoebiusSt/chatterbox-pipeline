# Model-specific default config for Qwen3 TTS (qwen3, 1.7B base, 10 languages).
# Inherits everything from default_config.yaml and overrides model-specific values.
# Job configs that use Qwen3 can reference this file:
#
#   parent: defaults/qwen3.yaml
#
# They then only need to specify job-specific overrides (text file, speakers, etc.).

parent: default_config.yaml

chunking:
  # Qwen3 is longform-capable (less than VibeVoice but well beyond Chatterbox).
  # Paragraph-break semantics (force_paragraph_chunks=false):
  #   HARD boundaries: only double-empty-line breaks (\n\n\n+, i.e. >= 3 consecutive newlines).
  #   The chunker never packs text across these; the last chunk before such a break receives
  #   paragraph_break_type="long" so Assembly inserts audio.silence_duration.long (default 1.30 s).
  #   SOFT boundaries: single empty lines (\n\n) are preferred split-points once a chunk reaches
  #   target_chunk_limit, but the chunker may span them if the section is shorter.
  #   Micro-chunks are merged into neighbors, but never across a hard boundary or speaker transition.
  #   Speaker-transition splits (<speaker:*>) remain the highest priority regardless.
  # Note: max_chunk_limit must stay compatible with tts_params.max_new_tokens
  # (Qwen3 audio-token budget ≈ 50 tok/s; 4096 tokens ≈ 80 s ≈ ~1500 chars at 140 wpm).
  force_paragraph_chunks: false
  target_chunk_limit: 1400
  max_chunk_limit: 2000
  min_chunk_length: 100

generation:
  model_type: qwen3
  num_candidates: 2
  max_retries: 1
  global_seed: 0  # Base Seed + Candidate-Offset + Text-Hash keeps Tasks reproducible but Chunks discerned
  seed_fixed: false # true = one torch seed everywhere (docs/SEEDING.md); needs global_seed > 0 or speaker seed > 0
  default_speaker: default_speaker_template

  speakers:
    - id: default_speaker_template
# =============================================================================
# UNIVERSAL DEFAULT for unknown new speakers
# =============================================================================
# Stays below the lowest observed safety ceiling of fragile-but-usable speakers.
# After 1 production run, listen to a candidate and adjust based on perception.
# =============================================================================
      reference_audio: stephan_moebius_7_DE_15s.wav
      language: de
      tts_params:
        do_sample: true
        max_new_tokens: 4096 # raised for longform chunks (target=1200, max=2000 chars)
        # Qwen3 parameters – see readme_agent.md (unified ramp: param = base + dev*ramp_pos).
        temperature: 1.089 # start; positive temperature_max_deviation → ramp UP
        temperature_max_deviation: +0.378
        top_k: 114 # start; positive top_k_max_deviation → ramp UP
        top_k_max_deviation: +49
        top_p: 0.99
        repetition_penalty: 1.07
        subtalker_temperature: 1.456 # start; negative sign of subtalker_temperature_max_deviation sets direction RAMP DOWN
        subtalker_temperature_max_deviation: -0.289
        subtalker_top_k: 206 # start; negative subtalker_top_k_max_deviation → ramp DOWN
        subtalker_top_k_max_deviation: -49
        subtalker_top_p: 0.97
      conservative_candidate:
        enabled: true
        tts_params:
          temperature: 1.089
          top_k: 114
          top_p: 0.98
          repetition_penalty: 1.07
          subtalker_temperature: 1.456
          subtalker_top_k: 181
          subtalker_top_p: 0.98

    
# =============================================================================
# PER-SPEAKER PRODUCTION RAMPING — final recommendations
# =============================================================================
#
# Based on 26-speaker bench run (April 2026), re-scored with refined gating
# (asr_valid + duration_gate + mos_threshold). Hallucination detection:
# all 12 known collapses correctly caught by passes_duration_gate=False.
#
# METHODOLOGY
# Score margins between top-1 and top-3 positions are typically 0.005-0.02,
# which is within re-scoring noise. So instead of single-peak recommendations,
# we use the TOP-3 ENVELOPE: the range covering the three best-scoring
# positions, clamped at the safety ceiling (first hallucinating position - 1).
#
# This gives a robust 4-position production ramp that brackets the actual
# sweet spot, regardless of which exact position scores highest on any given
# re-evaluation.
# =============================================================================

