# Model-specific default config for VibeVoice (vibevoice / vibevoice_1_5b / vibevoice_q4).
# Inherits everything from default_config.yaml and overrides model-specific values.
# Job configs that use VibeVoice can reference this file:
#
#   parent: defaults/vibevoice.yaml
#
# Override generation.model_type to vibevoice_1_5b or vibevoice_q4 in your job if needed.
# All three VibeVoice variants share the same tts_params keys.

parent: default_config.yaml

chunking:
  # VibeVoice handles long-form audio natively; raise chunk limits accordingly.
  # Paragraph-break semantics (force_paragraph_chunks=false):
  #   HARD boundaries: only double-empty-line breaks (\n\n\n+, i.e. >= 3 consecutive newlines).
  #   The chunker never packs text across these; the last chunk before such a break receives
  #   paragraph_break_type="long" so Assembly inserts audio.silence_duration.long (default 1.30 s).
  #   SOFT boundaries: single empty lines (\n\n) are preferred split-points once a chunk reaches
  #   target_chunk_limit, but the chunker may span them if the section is shorter.
  #   Micro-chunks are merged into neighbors, but never across a hard boundary or speaker transition.
  #   Speaker-transition splits (<speaker:*>) remain the highest priority regardless.
  force_paragraph_chunks: false
  target_chunk_limit: 2800
  max_chunk_limit: 4800
  min_chunk_length: 120

validation:
  similarity_threshold: 0.90  # WhisperValidator: token-based similarity of original and 
  min_quality_score: 0.90  #  WhisperValidator: 70% * similarity_score + 30% * length_score
  preprocessing:
    tail_trim:
      enabled: false
  selection:
      gating:
        require_mos: true

generation:
  model_type: vibevoice_q4  # override to vibevoice_1_5b or vibevoice_q4 in your job if needed
  num_candidates: 3
  max_retries: 1
  default_speaker: default_speaker

  vibevoice:
    # When true, unsupported language codes raise ValueError instead of silently
    # falling back to English. VibeVoice officially supports only English ("en")
    # and Chinese ("zh"). Default false keeps historical behaviour (submitting language to the model) with a single
    # warning logged once per language.
    language_strict: false

# =============================================================================
# VIBEVOICE Q4 PER-SPEAKER PRODUCTION RAMPING
# =============================================================================
#
# Based on 25-speaker bench run (April 2026) using two transects per speaker
# (T1: cool start at temp=0.90, T2: warm start at temp=1.30), each with 5
# candidate positions, 2 chunks (one with multiple short paragraphs preserved
# via force_paragraph_chunks=false, one continuous long paragraph).
#
# METHODOLOGY
# Score margins between candidates are extremely tight (often within
# 0.01-0.02 final_selection_score). UTMOS-based scoring tends to over-reward
# stable/calm output and under-reward expressive prosody. Recommendations are
# therefore based on a balanced metric: 50% final_selection_score + 50%
# prosody_liveliness, normalized per speaker. Recommendations:
#   - centroid = weighted mean of top-3 (transect, position) coordinates
#   - range = ±0.20 temperature, ±0.05 cfg_scale, ±10 diffusion_steps
#
# NO HALLUCINATIONS detected in any of 500 candidates (vs. 12 in qwen3 bench).
# VibeVoice Q4 is robust on long-form material; the parameter choice is more
# about expressiveness than safety.
# =============================================================================

speakers:
# =============================================================================
# UNIVERSAL DEFAULT TEMPLATE for unknown new speakers
# =============================================================================
# Aggregate centroid across the 25 tested speakers, with a slightly wider range
# to bracket variation between speakers. After 1 production run, listen to a
# candidate and adjust based on perception.
# Aggregate centroids: temp=1.50 (range 1.20-1.82),
# cfg_scale=1.377 (range 1.320-1.455),
# diffusion=40 (range 32-53)
# =============================================================================
  - id: default_speaker
    reference_audio: stephan_moebius_2.wav
    language: en # vibevoice has many languages available. The language param is not used, but needed for whisper.       
    tts_params: # VibeVoice parameters – see readme_agent.md for ramp semantics.
      temperature: 1.25
      temperature_max_deviation: 0.50              # -> 1.75
      top_p: 0.98
      cfg_scale: 1.327
      cfg_scale_max_deviation: 0.100             # -> 1.427
      diffusion_steps: 30
      diffusion_steps_max_deviation: 20                 # -> 50
      voice_speed_factor: 1.00
      use_sampling: true
# =============================================================================
# CONSERVATIVE CANDIDATE for VibeVoice
# =============================================================================
# A single safe set of parameters that runs alongside the ramp. Selected as the
# coordinate that appeared in the top-3 for the LARGEST number of speakers under
# both score AND combined metrics. Conservative here means "broadly applicable",
# not "extra safe" — VibeVoice has no hallucination cliff to worry about.
# =============================================================================
    conservative_candidate:
      enabled: true
      temperature: 1.45         # T2 pos 2 — top-3 finalist for 12/25 speakers
      top_p: 0.98
      cfg_scale: 1.338
      diffusion_steps: 35
      voice_speed_factor: 1.00
      use_sampling: true

