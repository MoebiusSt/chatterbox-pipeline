[mypy]
python_version = 3.12
ignore_missing_imports = True
show_error_codes = True
show_column_numbers = True
pretty = True
explicit_package_bases = True

# Exclude scripts and vendored third-party code to avoid path conflicts and
# upstream type noise (VibeVoice is shipped as-is from Microsoft).
exclude = (?x)(
    ^scripts/.*
    | ^src/third_party/.*
  )

# Don't check duplicate modules
warn_unused_ignores = False
warn_redundant_casts = False

# Vendored VibeVoice: block type-checking at the module level as a second
# safety net in case paths change.
[mypy-src.third_party.vibevoice.*]
ignore_errors = True

[mypy-third_party.vibevoice.*]
ignore_errors = True
